<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>モックアップ: 描きながらの説明（ホワイトボードアニメーション）</title>
<style>
  :root { --bg: #EEF3FF; --ink: #1B2430; --sub: #5B6676; --line: #C9D5F0; --blue: #1A5CFF; --soft: #DCE6FF;
    --paper: #FAF7EE; --ray: #B45C00; --penb: #176AA3; --penr: #B23A36; --normal: #67748B; --green: #216E43;
    --hand: "Klee", "Klee One", "UD デジタル 教科書体 NK-R", "UD Digi Kyokasho NK-R", "Hiragino Maru Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.65;
    font-family: "Hiragino Sans", "Yu Gothic UI", Meiryo, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.note { color: var(--sub); font-size: 14px; margin: 0 0 14px; }
  .frame { background: var(--bg); border-radius: 20px; box-shadow: 0 2px 10px rgba(26,60,140,.16); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .back { border: 0; background: transparent; font: inherit; font-size: 16px; min-height: 44px; color: var(--ink); cursor: pointer; }
  .title { font-weight: 700; font-size: 17px; }
  .spacer { flex: 1; }
  .chip { font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--sub); }
  .chip.ok { color: var(--green); }
  .learn { display: grid; grid-template-columns: 64fr 36fr; gap: 12px; padding: 12px; }
  .board { background: var(--paper); background-image: radial-gradient(#EEE7D7 1px, transparent 1px); background-size: 28px 28px;
    border-radius: 16px; box-shadow: 0 2px 10px rgba(26,60,140,.12); overflow: hidden; display: flex; flex-direction: column; }
  .heading { padding: 12px 16px 0; }
  .heading span { font-family: var(--hand); font-weight: 700; font-size: 22px; background: linear-gradient(transparent 62%, #ffd24d 62%); }
  .board { position: relative; }
  .start { position: absolute; inset: 0; z-index: 2; background: rgba(250,247,238,.95); display: flex; flex-direction: column;
    gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .board .start svg { width: 64px; height: 64px; flex: none; }
  .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 420px; }
  .pick button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; min-height: 104px; border-radius: 14px;
    border: 3px solid transparent; background: #fff; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer;
    box-shadow: 0 1px 4px rgba(26,60,140,.10); }
  .pick button[aria-checked="true"] { border-color: var(--blue); background: var(--soft); }
  .pick button small { font-weight: 400; font-size: 12px; color: var(--sub); }
  .board .speech svg { width: 48px; height: 48px; }
  .start p { margin: 0; font-size: 18px; font-weight: 700; }
  .start .btn { min-width: 240px; min-height: 56px; font-size: 18px; }
  .start .startNote { font-size: 14px; font-weight: 400; color: var(--sub); }
  .speech { display: flex; gap: 10px; align-items: center; margin: 10px 14px 0; padding: 8px 14px 8px 8px; min-height: 64px;
    background: #fff; border-radius: 16px; box-shadow: 0 1px 4px rgba(26,60,140,.10); }
  .speech svg { flex: 0 0 48px; }
  .speech p { margin: 0; font-size: 18px; font-weight: 700; }
  .board svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .board svg text { font-family: var(--hand); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
  .board svg line, .board svg path { vector-effect: non-scaling-stroke; }
  .cap { border-top: 1px dashed #E3DBC8; padding: 10px 16px 12px; min-height: 52px; font-size: 18px; font-weight: 700; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .cap small { font-size: 16px; font-weight: 400; color: var(--sub); }
  .voiceMsg { margin: 0 12px 10px; padding: 10px 14px; border-radius: 12px; background: #FFF1C2; color: #1B2430; font-size: 15px; font-weight: 700; }
  .controls { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: #fff; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .btn { min-height: 48px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--soft); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.main { background: var(--blue); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .speed { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--sub); }
  .speed b { min-width: 64px; text-align: center; font-size: 17px; color: var(--ink); }
  .speed .btn { min-width: 48px; padding: 0; font-size: 22px; }
  .dots { display: flex; gap: 6px; flex: 1; min-width: 120px; align-items: center; }
  .dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .dots i.done { background: var(--blue); }
  .dots i.now { background: #7FA2FF; }
  .panel { background: #fff; border-radius: 16px; box-shadow: 0 2px 10px rgba(26,60,140,.12); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 320px; }
  .say { display: flex; gap: 10px; align-items: flex-start; }
  .say svg { flex: 0 0 48px; }
  .say p { margin: 0; font-size: 17px; }
  .say p { font-size: 15px; font-weight: 700; }
  .say.old p { font-weight: 400; color: var(--sub); }
  .label { font-size: 15px; color: var(--sub); font-weight: 700; margin-top: 4px; }
  .try { display: flex; gap: 10px; font-size: 16px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .try.done { color: var(--green); font-weight: 700; }
  .ask { border: 1px dashed var(--line); border-radius: 14px; padding: 8px 12px; color: var(--sub); font-size: 14px; background: #F4F6FA; }
  .panel .btn { margin-top: auto; }
  [hidden] { display: none !important; }
  body.rec h1, body.rec p.note { display: none; }
  body.rec main { padding-top: 12px; max-width: 1256px; }
  @media (max-width: 900px) { .learn { grid-template-columns: 1fr; } .panel { min-height: 0; } }
</style>
</head>

<main>
  <h1>モックアップ: 描きながらの説明</h1>
  <p class="note">盤を開くと、キューブ先生が話しながら、図を 1 手ずつ描いていきます。終わると、今までどおり自分で動かせます。見た目と動きを確かめるための見本で、反射の盤だけを作っています。</p>

<script>
(function () {
  var P = { x: 300, y: 300 }, R = 220, deg = 37, interactive = false;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(id) { return document.getElementById(id); }
  function pt(r, d, side) { var a = d * Math.PI / 180; return { x: P.x + side * r * Math.sin(a), y: P.y - r * Math.cos(a) }; }
  function lerp(a, b, p) { return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p }; }
  function vis(el, on) { el.style.display = on ? '' : 'none'; }
  var pen = $('pen');
  function penAt(q) { if (interactive) return; pen.hidden = false; pen.setAttribute('transform', 'translate(' + q.x.toFixed(1) + ',' + q.y.toFixed(1) + ')'); }

  // 1 手ずつの描き方。p は 0（まだ）〜1（描き終わり）。位置は今の deg から毎回計算する
  function line(el, from, to) { return function (p) {
    vis(el, p > 0); if (p <= 0) return; var a = from(), b = lerp(a, to(), p);
    el.setAttribute('x1', a.x); el.setAttribute('y1', a.y); el.setAttribute('x2', b.x); el.setAttribute('y2', b.y);
    if (p < 1) penAt(b);
  }; }
  function text(el, str, pos, anchor) { return function (p) {
    vis(el, p > 0); if (p <= 0) return; var s = str(), q = pos();
    el.textContent = s.slice(0, Math.ceil(s.length * p));
    el.setAttribute('x', q.x); el.setAttribute('y', q.y); el.setAttribute('text-anchor', (anchor && anchor()) || 'start');
    if (p < 1) penAt({ x: q.x + (anchor && anchor() === 'end' ? -4 : s.length * 17 * p), y: q.y });
  }; }
  function arc(el, side) { return function (p) {
    vis(el, p > 0); if (p <= 0) return; var r = 54, e = pt(r, deg * p, side);
    el.setAttribute('d', 'M' + P.x + ' ' + P.y + ' L' + P.x + ' ' + (P.y - r) + ' A' + r + ' ' + r + ' 0 0 ' + (side < 0 ? 0 : 1) + ' ' + e.x + ' ' + e.y + ' Z');
    if (p < 1) penAt(e);
  }; }
  function arrow(el, from, to, t) { return function (p) {
    vis(el, p > 0); if (p <= 0) return; var a = from(), b = to(), m = lerp(a, b, t), g = Math.atan2(b.y - a.y, b.x - a.x), s = 14 * Math.min(1, p * 1.5);
    function q(da, r) { return (m.x + r * Math.cos(g + da)).toFixed(1) + ',' + (m.y + r * Math.sin(g + da)).toFixed(1); }
    el.setAttribute('points', q(0, s) + ' ' + q(2.5, s) + ' ' + q(-2.5, s));
  }; }
  function pop(el, where) { return function (p) {
    vis(el, p > 0); if (p <= 0) return; var q = where();
    el.setAttribute('transform', 'translate(' + q.x + ',' + q.y + ') scale(' + (0.4 + 0.6 * p).toFixed(2) + ')'); el.style.opacity = p;
  }; }
  function ticks(p) {
    var g = $('ticks'); vis(g, p > 0); if (p <= 0) return;
    if (!g.childNodes.length) for (var i = 0; i < 8; i++) { var l = document.createElementNS('http://www.w3.org/2000/svg', 'line'), x = 112 + i * 54;
      l.setAttribute('x1', x); l.setAttribute('y1', P.y + 4); l.setAttribute('x2', x - 12); l.setAttribute('y2', P.y + 18); g.appendChild(l); }
    for (var k = 0; k < 8; k++) vis(g.childNodes[k], k < Math.ceil(p * 8));
  }
  function S() { return pt(R, deg, -1); } function O() { return pt(R, deg, 1); }
  function lab(side, dy) { return function () {
    var q = deg >= 45 ? pt(96, deg / 2, side) : pt(104, deg + 14, side); return { x: q.x, y: q.y + dy }; }; }
  function anc(side) { return function () { return deg >= 45 ? 'middle' : (side < 0 ? 'end' : 'start'); }; }
  function halo(p) { $('halo').style.opacity = p; }

  var STEPS = [
    { say: '順番にいこう。まず、鏡を描くよ。', acts: [
      [700, line($('mirror'), function () { return { x: 80, y: P.y }; }, function () { return { x: 520, y: P.y }; })],
      [500, ticks],
      [300, text($('tMirror'), function () { return '鏡'; }, function () { return { x: 84, y: P.y + 42 }; })] ] },
    { say: '光源から、鏡に光を当ててみよう。', acts: [
      [350, pop($('src'), S)],
      [300, text($('tSrc'), function () { return '光源'; }, function () { var s = S(); return { x: s.x + 24, y: s.y + 6 }; })],
      [900, line($('rayIn'), S, function () { return P; })],
      [200, arrow($('arrIn'), S, function () { return P; }, 0.3)] ] },
    { say: '鏡に垂直な線を引くよ。これを「法線」というんだ。', acts: [
      [800, line($('normal'), function () { return P; }, function () { return { x: P.x, y: 60 }; })],
      [350, text($('tNormal'), function () { return '法線'; }, function () { return { x: P.x + 8, y: 78 }; })] ] },
    { say: '光は鏡ではね返る。これが「反射」。', acts: [
      [900, line($('rayOut'), function () { return P; }, O)],
      [200, arrow($('arrOut'), function () { return P; }, O, 0.78)] ] },
    { say: '法線と、入ってくる光の間の角が「入射角」。', acts: [
      [600, arc($('arcIn'), -1)],
      [400, text($('nIn'), function () { return '入射角'; }, lab(-1, -24), anc(-1))],
      [300, text($('vIn'), function () { return Math.round(deg) + '°'; }, lab(-1, 0), anc(-1))] ] },
    { say: '法線と、はね返った光の間の角が「反射角」。くらべてみると…', acts: [
      [600, arc($('arcOut'), 1)],
      [400, text($('nOut'), function () { return '反射角'; }, lab(1, -24), anc(1))],
      [300, text($('vOut'), function () { return Math.round(deg) + '°'; }, lab(1, 0), anc(1))] ] },
    { say: 'ここがポイント。入射角と反射角は、いつも同じ。光源を動かして、たしかめてみよう。', acts: [ [500, halo] ] }
  ];
  var HOLD = 1500;   // 1 つの手のあと、次へ進むまでの間（読む時間）

  // 先生は生徒がえらぶ。理科の中身（用語・順番・描くもの）は同じで、言い回しと声だけが先生ごとに変わる
  var TEACHERS = [
    { id: 'A', name: 'まる先生', tone: 'ていねい', pitch: 1.0, rate: 0.95 },
    { id: 'B', name: 'しずく博士', tone: 'のんびり', pitch: 1.1, rate: 0.9 },
    { id: 'C', name: 'ぷにカプセル', tone: '元気', pitch: 1.25, rate: 1.05 },
    { id: 'D', name: 'もくもく先生', tone: 'ゆったり', pitch: 0.85, rate: 0.9 },
    { id: 'E', name: 'キューブ先生', tone: 'きっちり', pitch: 1.0, rate: 1.0 },
    { id: 'F', name: 'まめ博士', tone: 'わくわく', pitch: 1.2, rate: 1.0 }
  ];
  var LINES = {
    A: ['だいじょうぶ、いっしょに見ていきましょう。まず、鏡を描きますよ。', '光源から、鏡に光を当ててみましょう。', '鏡に垂直な線を引きます。これを「法線」といいますよ。',
      '光は鏡ではね返ります。これが「反射」ですよ。', '法線と、入ってくる光の間の角が「入射角」です。', '法線と、はね返った光の間の角が「反射角」です。くらべてみましょう。',
      '入射角と反射角は、いつも同じですよ。光源を動かして、たしかめてみましょう。'],
    B: ['よーく見てごらん。まず、鏡を描くよ。', '光源から、鏡に光を当ててみようかなあ。', '鏡に垂直な線を引くよ。これが「法線」だねえ。',
      '光が鏡ではね返ったねえ。これが「反射」。', '法線と、入ってくる光の間の角が「入射角」だよ。', '法線と、はね返った光の間の角が「反射角」。くらべると、どうかなあ。',
      '入射角と反射角は、いつも同じなんだねえ。光源を動かして、よーく見てごらん。'],
    C: ['やってみよう！ まず、鏡を描くよ！', '光源から、鏡に光を当ててみよう！', '鏡に垂直な線を引くよ。これが「法線」だ！',
      '光が鏡ではね返った！ これが「反射」だよ！', '法線と、入ってくる光の間の角が「入射角」だよ！', '法線と、はね返った光の間の角が「反射角」。くらべてみよう！',
      '入射角と反射角は、いつも同じ！ 光源を動かして、やってみよう！'],
    D: ['大きく考えよう。まず、鏡を描いてみるよ。', '光源から、鏡に光を当ててごらん。', '鏡に垂直な線を引くよ。これを「法線」というんだなあ。',
      '光は鏡ではね返る。これが「反射」なんだなあ。', '法線と、入ってくる光の間の角が「入射角」。', '法線と、はね返った光の間の角が「反射角」。くらべてごらん。',
      '入射角と反射角は、いつも同じなんだなあ。光源を動かして、たしかめてごらん。'],
    E: ['順番にいこう。まず、鏡を描くよ。', '光源から、鏡に光を当ててみよう。', '鏡に垂直な線を引くよ。これを「法線」というんだ。',
      '光は鏡ではね返る。これが「反射」。', '法線と、入ってくる光の間の角が「入射角」。', '法線と、はね返った光の間の角が「反射角」。くらべてみると…',
      'ここがポイント。入射角と反射角は、いつも同じ。光源を動かして、たしかめてみよう。'],
    F: ['のぞいてみよう。まず、鏡を描くよ。', '光源から、鏡に光を当ててみるね。', '鏡に垂直な線を引くよ。これは「法線」っていうんだって！',
      '見つけた！ 光が鏡ではね返ったよ。これが「反射」。', '法線と、入ってくる光の間の角が「入射角」なんだって。', '法線と、はね返った光の間の角が「反射角」。くらべてみると… ふしぎだねえ。',
      '入射角と反射角は、いつも同じなんだって！ 光源を動かして、たしかめてみよう。']
  };
  var teacher = TEACHERS[4];   // 「光の世界」のはじめの先生はキューブ先生
  function L(k) { return LINES[teacher.id][k]; }
  function choose(t) {
    teacher = t; $('face').setAttribute('href', '#tutor' + t.id);
    Array.prototype.forEach.call($('pick').children, function (b) { b.setAttribute('aria-checked', b.dataset.id === t.id ? 'true' : 'false'); });
    $('pickNote').textContent = t.name + 'が、描きながら説明するよ。';
    if (step !== undefined) talk(step);   // 出ている言葉も、えらんだ先生の言い回しに直す
  }
  TEACHERS.forEach(function (t) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.id = t.id;
    b.innerHTML = '<svg width="64" height="64"><use href="#tutor' + t.id + '"/></svg>';
    var n = document.createElement('span'); n.textContent = t.name; var s = document.createElement('small'); s.textContent = t.tone;
    b.appendChild(n); b.appendChild(s); b.addEventListener('click', function () { choose(t); }); $('pick').appendChild(b);
  });

  var dots = $('dots'); STEPS.forEach(function () { dots.appendChild(document.createElement('i')); });
  function cap() {
    var c = $('cap'); c.textContent = '';
    if (step >= 5 || interactive) {
      var a = document.createElement('span'), e = document.createElement('span'), b = document.createElement('span'), n = Math.round(deg);
      a.textContent = '入射角 ' + n + '°'; a.style.color = '#176AA3'; e.textContent = '＝'; b.textContent = '反射角 ' + n + '°'; b.style.color = '#B23A36';
      c.appendChild(a); c.appendChild(e); c.appendChild(b);
    }
    if (interactive) { var s = document.createElement('small'); s.textContent = 'オレンジの丸（光源）は指で動かせるよ'; c.appendChild(s); }
  }
  function talk(i) {
    $('speechText').textContent = L(i);   // 今の言葉は、盤のすぐ上に出す（1 列の画面でも見える）
    var box = $('talk'); box.textContent = '';
    var h = document.createElement('div'); h.className = 'label'; h.textContent = 'ここまでの説明'; box.appendChild(h);
    for (var k = 0; k <= i; k++) {            // 横のパネルには、ここまでの説明を番号つきで残す
      var d = document.createElement('div'); d.className = 'say' + (k < i ? ' old' : '');
      var p = document.createElement('p'); p.textContent = (k + 1) + '. ' + L(k); d.appendChild(p); box.appendChild(d);
    }
  }
  function mark() { for (var k = 0; k < STEPS.length; k++) dots.childNodes[k].className = k < step ? 'done' : (k === step ? 'now' : ''); }
  function runStep(k, p) { STEPS[k].acts.forEach(function (a) { a[1](p); }); }
  function showUpTo(k) { for (var s = 0; s < STEPS.length; s++) runStep(s, s < k ? 1 : 0); pen.hidden = true; }

  // 音声: あらかじめ作った音声ファイル（VOICEVOX Nemo）を再生する。1 手につき 1 ファイル
  // DUR は各ファイルの長さ（秒）。描く速さを声の長さに合わせるために使う
  var DUR = {"A":[5.24,3.31,4.38,4.27,4.35,5.81,6.34],"B":[3.56,3.32,3.78,4.16,4.09,6.08,6.45],"C":[3.23,3.26,3.7,3.97,4.36,5.3,5.66],"D":[3.98,3.03,4.13,3.86,3.96,5.01,6.18],"E":[3.7,3.13,3.9,3.65,3.83,4.97,7.25],"F":[3.4,3.18,4.26,4.81,4.59,6.28,6.33]};
  var RATES = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2], rate = 1;   // 速さ: 0.5 倍〜2 倍、0.25 きざみ
  var audio = new Audio(); audio.preload = 'auto';
  var voiceOn = false, speaking = false, started = false, token = 0, fallback = 0;
  function quiet() { token++; speaking = false; clearTimeout(fallback); audio.pause(); }
  function speak(k) {
    quiet(); if (!voiceOn) return;
    var mine = token;
    function end() { if (mine === token) { speaking = false; clearTimeout(fallback); } }
    audio.onended = end;
    audio.onerror = function () { end(); voiceFail('音声ファイルを読みこめませんでした'); };                    // 読みこめないときは、文字だけで先へ進む
    audio.src = 'voice-samples/reflect/' + teacher.id + '/' + (k + 1) + '.mp3';
    audio.defaultPlaybackRate = rate; audio.playbackRate = rate;
    speaking = true; fallback = setTimeout(end, (DUR[teacher.id][k] / rate + 4) * 1000);   // 終わりの合図が来ないときのため
    var p = audio.play();
    if (p && p.catch) p.catch(function (e) { end(); voiceOn = false; soundLabel(); voiceFail('この画面では音を出せませんでした（' + ((e && e.name) || '理由不明') + '）'); });   // 再生を断られたら、音声をオフにして続ける
  }
  // 音が出せなかったときは、だまって消さずに、目に見える形で知らせる
  function voiceFail(why) { var m = $('voiceMsg'); m.textContent = why + '。文字だけで続けます。Chrome か Edge でこのページをじかに開くと、声が聞けます。'; m.hidden = false; }
  function soundLabel() { $('bSound').textContent = voiceOn ? '🔊 音声オン' : '🔇 音声オフ'; $('bSound').setAttribute('aria-pressed', voiceOn ? 'true' : 'false'); }
  function rateLabel() {
    $('rateText').textContent = rate + ' 倍'; $('bSlow').disabled = rate <= RATES[0]; $('bFast').disabled = rate >= RATES[RATES.length - 1];
    audio.defaultPlaybackRate = rate; audio.playbackRate = rate;   // 再生中の声にも、すぐ反映する
  }
  function stepRate(d) { var i = RATES.indexOf(rate) + d; if (i >= 0 && i < RATES.length) { rate = RATES[i]; rateLabel(); } }
  $('bSlow').addEventListener('click', function () { stepRate(-1); });
  $('bFast').addEventListener('click', function () { stepRate(1); });
  // 1 手を描く時間の倍率: 声があるときは、声の長さの 8 割で描き終わるように引きのばす
  function stretch(k) {
    var sum = STEPS[k].acts.reduce(function (a, b) { return a + b[0]; }, 0);
    return voiceOn ? Math.max(1, DUR[teacher.id][k] * 800 / sum) : 1;
  }

  var step = 0, act = 0, t0 = 0, playing = true, holdUntil = 0, raf = 0;
  function begin(k) { step = k; act = 0; t0 = 0; holdUntil = 0; showUpTo(k); talk(k); mark(); cap(); $('bBack').disabled = k === 0; if (started) speak(k); }
  rateLabel();
  function start(withVoice) { voiceOn = !!withVoice; started = true; $('start').hidden = true; soundLabel(); speak(step); }
  choose(teacher);
  $('bTeacher').addEventListener('click', function () {   // 先生をかえると、説明は 1 手目からやり直す
    quiet(); started = false; playing = true; $('bPlay').textContent = '⏸ 止める'; $('start').hidden = false; begin(0);
  });
  $('bVoice').addEventListener('click', function () { start(true); });
  $('bMute').addEventListener('click', function () { start(false); });
  $('bSound').addEventListener('click', function () { voiceOn = !voiceOn; soundLabel(); if (voiceOn) speak(step); else quiet(); });
  function finishStep() { runStep(step, 1); pen.hidden = true; act = STEPS[step].acts.length; cap(); }
  function tick(now) {
    raf = requestAnimationFrame(tick);
    if (interactive || !playing || !started) return;
    var acts = STEPS[step].acts;
    if (act < acts.length) {
      if (!t0) t0 = now;
      var dur = reduce ? 1 : acts[act][0] * stretch(step) / rate, p = Math.min(1, (now - t0) / dur);
      acts[act][1](p);
      if (p >= 1) { act++; t0 = 0; if (act >= acts.length) { pen.hidden = true; holdUntil = now + HOLD / rate; cap(); } }
    } else if (now >= holdUntil && !speaking) {   // 描き終わりと、読み終わりの両方を待つ
      if (step + 1 < STEPS.length) begin(step + 1); else finish();
    }
  }
  function finish() {
    quiet(); showUpTo(STEPS.length); interactive = true; pen.hidden = true; step = STEPS.length - 1; mark();
    dots.childNodes[step].className = 'done';
    $('controls').hidden = true; $('after').hidden = false; $('bReplay').hidden = false;
    talk(STEPS.length - 1); cap(); $('src').style.cursor = 'grab';
  }
  $('bPlay').addEventListener('click', function () { playing = !playing; t0 = 0; this.textContent = playing ? '⏸ 止める' : '▶ 再生'; if (voiceOn && speaking) { if (playing) audio.play(); else audio.pause(); } });
  $('bNext').addEventListener('click', function () {
    if (act < STEPS[step].acts.length) { quiet(); finishStep(); holdUntil = performance.now() + HOLD; return; }
    if (step + 1 < STEPS.length) begin(step + 1); else finish();
  });
  $('bBack').addEventListener('click', function () { if (step > 0) begin(act === 0 || step === 0 ? step - 1 : step - 1); });
  $('bSkip').addEventListener('click', finish);
  $('bReplay').addEventListener('click', function () {
    interactive = false; deg = 37; playing = true; $('bPlay').textContent = '⏸ 止める';
    $('controls').hidden = false; $('after').hidden = true; $('bReplay').hidden = true; $('src').style.cursor = ''; begin(0);
  });

  // 説明が終わったあと: 自分で動かす
  var dragging = false, svg = $('b');
  $('src').addEventListener('pointerdown', function (e) { if (!interactive) return; dragging = true; $('src').setPointerCapture(e.pointerId); });
  $('src').addEventListener('pointermove', function (e) {
    if (!dragging) return; var r = svg.getBoundingClientRect();
    var x = (e.clientX - r.left) * 600 / r.width, y = (e.clientY - r.top) * 360 / r.height;
    deg = Math.min(80, Math.max(0, Math.atan2(P.x - x, P.y - y) * 180 / Math.PI));
    showUpTo(STEPS.length); cap();
    if (Math.abs(deg - 60) <= 2) { $('try1').className = 'try done'; $('try1m').textContent = '✓'; }
  });
  function up() { dragging = false; }
  $('src').addEventListener('pointerup', up); $('src').addEventListener('pointercancel', up);

  // 録画用: 時刻 ms（ミリ秒）の画面を、その場で 1 枚描く（動画を作る道具から呼ぶ。ふだんの動きには関係しない）
  window.__mock = {
    timeline: function (teacherId) {
      choose(TEACHERS.filter(function (x) { return x.id === teacherId; })[0] || teacher); voiceOn = true;
      var t = 0;
      return STEPS.map(function (s, k) {
        var draw = s.acts.reduce(function (a, b) { return a + b[0]; }, 0) * stretch(k), len = Math.max(draw, DUR[teacher.id][k] * 1000) + HOLD;
        var o = { start: t, draw: Math.round(draw), len: Math.round(len) }; t += len; return o;
      });
    },
    renderAt: function (ms, teacherId) {
      cancelAnimationFrame(raf); started = true; interactive = false; document.body.classList.add('rec');
      var tl = this.timeline(teacherId), last = tl[tl.length - 1]; soundLabel();
      $('controls').hidden = false; $('after').hidden = true; $('bReplay').hidden = true;
      if (ms < 0) { $('start').hidden = false; step = 0; showUpTo(0); talk(0); mark(); cap(); return; }
      $('start').hidden = true;
      if (ms >= last.start + last.len) { finish(); return; }
      var k = 0; while (k + 1 < tl.length && ms >= tl[k + 1].start) k++;
      step = k; showUpTo(k); talk(k); mark();
      var local = ms - tl[k].start, st = stretch(k), acc = 0, all = true;
      STEPS[k].acts.forEach(function (a) { var d = a[0] * st, p = Math.max(0, Math.min(1, (local - acc) / d)); a[1](p); if (p < 1) all = false; acc += d; });
      act = all ? STEPS[k].acts.length : 0; if (all) pen.hidden = true; cap();
    }
  };

  begin(0); raf = requestAnimationFrame(tick);
})();
</script>
</body>
